<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>CyberDigest — Daily Cyber Ideas</title>
  <meta name="description" content="Bite-size daily cyber security news from around the world with a GCC focus: UAE, Saudi Arabia, Qatar, Oman, Bahrain and Kuwait." />
  <meta name="theme-color" content="#0b1724" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/app.css" />
  <script>
    try { const s = JSON.parse(localStorage.getItem('cyberdigest:v1') || '{}'); const t = s.prefs && s.prefs.theme; if (t && t !== 'system') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="Main navigation">
      <a class="brand" href="#/today">
        <img src="assets/icons/icon.svg" alt="" width="36" height="36" />
        <span><strong>CyberDigest</strong><small>Daily cyber ideas</small></span>
      </a>
      <nav class="nav" id="nav"></nav>
      <div class="side-card" id="sideStats"></div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="pageTitle">Today</h1>
          <p id="pageSub" class="muted"></p>
        </div>
        <div class="topbar-actions">
          <button class="icon-btn" id="btnTheme" title="Toggle theme" aria-label="Toggle theme">🌓</button>
        </div>
      </header>
      <section id="view" class="view" tabindex="-1"></section>
    </main>
  </div>

  <nav class="bottom-nav" id="bottomNav" aria-label="Mobile navigation"></nav>

  <!-- Story reader -->
  <dialog id="reader" class="sheet">
    <div class="sheet-card" id="readerBody"></div>
  </dialog>

  <!-- Save to stash -->
  <dialog id="saveDlg" class="modal">
    <form method="dialog" class="modal-card" id="saveForm">
      <h2>Save to a stash</h2>
      <div id="stashPick" class="stash-pick"></div>
      <label class="field"><span>New stash</span><input id="newStash" placeholder="e.g. Ransomware cases for my blog" maxlength="60" /></label>
      <label class="field"><span>Your note <small class="muted">(optional)</small></span><textarea id="saveNote" rows="3" placeholder="Why does this matter for our campus / organisation?"></textarea></label>
      <div class="row end">
        <button value="cancel" class="btn btn-ghost">Cancel</button>
        <button value="ok" class="btn btn-primary">Save</button>
      </div>
    </form>
  </dialog>

  <!-- First-run interests -->
  <dialog id="onboard" class="modal">
    <form method="dialog" class="modal-card wide" id="onboardForm"></form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  </script>
</body>
</html>
